<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Slide & Solve Google Ads</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Admin Styles -->
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="text-center mb-4">
      <div class="login-brand-icon">
        <i class="bi bi-broadcast-pin"></i>
      </div>
      <h3 class="fw-bold text-dark mb-1">Slide & Solve</h3>
      <p class="text-muted small">Google Ads Remote Config Admin Panel</p>
    </div>

    <!-- Alert Container -->
    <div id="loginAlert" class="alert alert-danger d-none py-2 px-3 small" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="login" class="input-label">Email or Username</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted border-end-0">
            <i class="bi bi-person"></i>
          </span>
          <input 
            type="text" 
            class="form-control border-start-0 ps-0" 
            id="login" 
            placeholder="admin or admin@example.com" 
            autocomplete="username" 
            required 
            autofocus
          >
        </div>
      </div>

      <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center">
          <label for="password" class="input-label">Password</label>
        </div>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted border-end-0">
            <i class="bi bi-lock"></i>
          </span>
          <input 
            type="password" 
            class="form-control border-start-0 border-end-0 ps-0" 
            id="password" 
            placeholder="••••••••••••" 
            autocomplete="current-password" 
            required
          >
          <button class="btn btn-outline-secondary border-start-0" type="button" id="togglePassword" aria-label="Toggle password view">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center shadow-sm">
        <i class="bi bi-box-arrow-in-right me-2"></i>
        Sign In to Admin
      </button>
    </form>

    <div class="mt-4 pt-3 border-top text-center">
      <span class="text-muted small">
        <i class="bi bi-shield-lock-fill me-1 text-primary"></i> 
        Protected with bcrypt & encrypted session cookies
      </span>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Auth JS -->
  <script src="/admin/js/auth.js"></script>
</body>
</html>
